name: Production Restore Drill

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact current main commit whose migrations will be replayed
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify-restore-candidate:
    name: Verify restore candidate without Production secrets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      execution_sha: ${{ steps.candidate.outputs.execution_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Verify exact current main commit and successful CI
        id: candidate
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          execution_sha="$(git rev-parse origin/main)"
          test "$execution_sha" = "$COMMIT_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${execution_sha}&branch=main&event=push&status=success&per_page=100" |
            jq -e --arg sha "$execution_sha" 'any(.workflow_runs[]; .head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success")' >/dev/null
          echo "execution_sha=$execution_sha" >> "$GITHUB_OUTPUT"
      - name: Check out verified restore commit
        env:
          EXECUTION_SHA: ${{ steps.candidate.outputs.execution_sha }}
        run: git checkout --detach "$EXECUTION_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:contract:check

  restore-production-logical-dump:
    name: Restore Production logical data into an isolated local target
    needs: verify-restore-candidate
    runs-on: ubuntu-latest
    environment:
      name: Production
    env:
      EXECUTION_SHA: ${{ needs.verify-restore-candidate.outputs.execution_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.verify-restore-candidate.outputs.execution_sha }}
      - name: Confirm pinned execution is still current main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$EXECUTION_SHA"
          test "$(git rev-parse origin/main)" = "$EXECUTION_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:contract:check
      - name: Restore, verify, and remove the isolated target
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          PRODUCTION_MIGRATION_CA_CERT: ${{ secrets.PRODUCTION_MIGRATION_CA_CERT }}
          RESTORE_EVIDENCE_PATH: ${{ runner.temp }}/evidence/production-restore.json
        run: pnpm release:restore:run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-restore-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/production-restore.json
          retention-days: 90
          if-no-files-found: error
