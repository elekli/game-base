name: Production Logical Restore Drill
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.30.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run isolated logical restore drill
        env:
          PRODUCTION_RESTORE_EXECUTE: "1"
          PRODUCTION_RESTORE_SOURCE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          PRODUCTION_RESTORE_SOURCE_PASSWORD: ${{ secrets.PRODUCTION_RESTORE_PASSWORD }}
          PGSSLROOTCERT: ${{ runner.temp }}/production-ca.pem
        run: pnpm release:restore:drill > "$RUNNER_TEMP/production-restore-evidence.json"
      - uses: actions/upload-artifact@v4
        with:
          name: production-restore-drill-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-restore-evidence.json
          retention-days: 90
