name: Preview Supabase Replay

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-supabase-replay
  cancel-in-progress: false

jobs:
  replay:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.30.3
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Replay migrations and run named security checks
        env:
          PREVIEW_PROJECT_REF: ${{ vars.PREVIEW_SUPABASE_PROJECT_REF }}
          PREVIEW_DIRECT_DATABASE_URL: ${{ secrets.PREVIEW_DIRECT_DATABASE_URL }}
          PREVIEW_RESET_CONFIRMATION: RESET_PREVIEW_ONLY
          PREVIEW_REPLAY_COMMIT_SHA: ${{ github.sha }}
        run: pnpm preview:replay
      - name: Upload non-secret replay evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-supabase-replay-${{ github.run_id }}
          path: docs/deployment/evidence/preview-supabase-replay.json
          if-no-files-found: error
