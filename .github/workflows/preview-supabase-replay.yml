name: Preview Supabase Replay

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RESET_PREVIEW_ONLY to authorize resetting Preview.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-supabase-replay
  cancel-in-progress: false

jobs:
  ref-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject non-main dispatch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Preview Supabase Replay must be dispatched from main."
          exit 1
      - name: Accept main dispatch
        if: github.ref == 'refs/heads/main'
        run: echo "Main-only replay guard passed."
  replay:
    needs: ref-guard
    if: github.ref == 'refs/heads/main' && needs.ref-guard.result == 'success'
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.30.3
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Replay migrations and run named security checks
        env:
          PREVIEW_PROJECT_REF: ${{ vars.PREVIEW_SUPABASE_PROJECT_REF }}
          PREVIEW_DIRECT_DATABASE_URL: ${{ secrets.PREVIEW_DIRECT_DATABASE_URL }}
          PREVIEW_RESET_CONFIRMATION: ${{ inputs.confirmation }}
          PREVIEW_REPLAY_COMMIT_SHA: ${{ github.sha }}
        run: pnpm preview:replay
      - name: Upload non-secret replay evidence
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: preview-supabase-replay-${{ github.run_id }}
          path: docs/deployment/evidence/preview-supabase-replay.json
          if-no-files-found: error
